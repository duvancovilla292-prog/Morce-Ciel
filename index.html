<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0d0914">
    <title>Morse Ciel</title>

    <!-- Favicon: reina de ajedrez neón (archivo favicon.svg junto a index.html) -->
    <link rel="icon" type="image/svg+xml" href="favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Cabecera HUD: debe ser <header>, no <div>, para que hideAllScreens() no la oculte -->
    <header class="hud-header">
        <span class="hud-status">SISTEMA CIEL: ACTIVO</span>
        <span class="hud-sub">MODO DE ANÁLISIS MORSE</span>
    </header>

    <div id="menu">
        <h1 style="color: var(--primary); margin-bottom: 5px;">Ciel Mora🫥</h1>
        <p style="color: var(--muted); margin-top: 0; font-size: 0.8rem; letter-spacing: .15em;">Selecciona qué estudiar</p>
        <button class="menu-btn" onclick="openModeSelector('vowels')">Vocales</button>
        <button class="menu-btn" onclick="openModeSelector('consonants')">Consonantes</button>
        <button class="menu-btn" onclick="openModeSelector('alphabet')">Abecedario</button>
        <button class="menu-btn" onclick="openModeSelector('numbers')">Números</button>
        <button class="menu-btn" onclick="showTranslator()">Traductor</button>
        <button class="menu-btn btn-accent" onclick="openGuide()">Guía</button>
    </div>

    <div id="mode-selector" class="game-container hidden">
        <h2 style="color: var(--secondary);">¿Cómo quieres practicar?</h2>
        <button class="menu-btn" onclick="startGame('classic')">Clásico (Ves Letra ➔ Escribes Morse)</button>
        <button class="menu-btn" onclick="startGame('visual')">Visual (Ves Morse ➔ Escribes Letra)</button>
        <button class="menu-btn" onclick="startGame('audio')">Auditivo (Escuchas Morse ➔ Escribes Letra)</button>
        <button class="btn-ghost" onclick="showMenu()" style="margin-top: 20px;">Volver</button>
    </div>

    <div id="game" class="game-container hidden">
        <h2 id="task-title" style="color: var(--primary); margin: 0;">Nivel</h2>
        <p id="mode-subtitle" style="color: var(--muted); margin: 5px 0 15px 0; font-size: 0.8rem; letter-spacing: .1em;"></p>

        <div id="feedback"></div>
        <div class="letter-display" id="target-letter">?</div>

        <button id="btn-replay" class="hidden btn-accent" onclick="playCurrentSequence()">
            <span class="sound-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Volver a escuchar
        </button>

        <div id="classic-controls">
            <div id="input-preview"></div>
            <div class="morse-keys">
                <button class="dot-btn" onmousedown="handleSound(0.1)" ontouchstart="handleSound(0.1)" onclick="addInput('.')">●</button>
                <button class="dash-btn" onmousedown="handleSound(0.3)" ontouchstart="handleSound(0.3)" onclick="addInput('-')">━</button>
            </div>
        </div>

        <div id="text-controls" class="hidden">
            <input type="text" id="text-answer" class="text-answer-input" maxlength="1" placeholder="?">
        </div>

        <button class="btn-success" onclick="checkAnswer()" style="margin-top: 20px;">VERIFICAR</button>
        <button class="btn-danger" onclick="showMenu()">SALIR</button>
    </div>

    <div id="results" class="game-container hidden">
        <h2 style="color: var(--secondary); font-size: 1.3rem;">¡Completado!</h2>
        <div class="results-box" id="results-content"></div>
        <button class="btn-success" onclick="showMenu()">VOLVER AL MENÚ</button>
    </div>

    <div id="translator" class="translator-container hidden">
        <h2 style="color: var(--primary)">Traductor Morse</h2>
        <div class="translator-grid">
            <div class="translator-box">
                <label>// Entrada de datos</label>
                <textarea id="textInput" placeholder="Escribe algo..." oninput="translateToMorse()"></textarea>
            </div>
            <div class="translator-box">
                <label>// Salida de análisis (espacio entre letras)</label>
                <textarea id="morseInput" placeholder="... --- ..." oninput="translateToText()"></textarea>
            </div>
        </div>
        <button class="btn-accent" onclick="playFullMorse()">
            <span class="sound-wave" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>Escuchar Mensaje
        </button>
        <button class="clear-btn" onclick="clearTranslator()">Limpiar</button>
        <button class="btn-ghost" onclick="showMenu()" style="margin-top: 15px;">VOLVER</button>
    </div>

    <div id="guide" class="game-container hidden">
        <h2 style="color: var(--secondary)">Manual</h2>
        <div class="tab-container">
            <button id="btnTabLetras" class="tab-btn tab-active" onclick="switchGuide('letters')">Letras</button>
            <button id="btnTabNumeros" class="tab-btn" onclick="switchGuide('numbers')">Números</button>
        </div>
        <div class="guide-grid" id="guide-list"></div>
        <button class="btn-success" onclick="showMenu()" style="margin-top: 15px;">VOLVER</button>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
